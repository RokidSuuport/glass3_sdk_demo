import groovy.json.JsonOutput

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.jetbrains.kotlin.android)
}

// 视觉巡检配置位于 inspection.properties。
// Vision inspection settings live in inspection.properties.
def visionConfig = new Properties()
def visionConfigFile = rootProject.file("inspection.properties")
if (visionConfigFile.exists()) {
    visionConfigFile.withInputStream { visionConfig.load(new InputStreamReader(it, "UTF-8")) }
}
def visionEngine = providers.gradleProperty("vision.engine")
        .orElse(visionConfig.getProperty("engine", "auto"))

android {
    namespace 'com.rokid.glesse'
    compileSdk 34

    defaultConfig {
        applicationId "com.rokid.glesse"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "VISION_MODEL_ENDPOINT",
                JsonOutput.toJson(visionConfig.getProperty("endpoint", "").trim())
        buildConfigField "String", "VISION_MODEL_NAME",
                JsonOutput.toJson(visionConfig.getProperty("model", "").trim())
        buildConfigField "String", "VISION_MODEL_API_KEY",
                JsonOutput.toJson(visionConfig.getProperty("apiKey", "").trim())
        buildConfigField "String", "VISION_ENGINE", JsonOutput.toJson(visionEngine.get().trim())

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            // 日常回归用的 release：不混淆、不裁剪，行为与 debug 一致。
            // Day-to-day release build: no obfuscation and no resource shrinking, behaviour matches debug.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        // 混淆/裁剪验证专用构建类型：配置与 release 相同，只把 R8 与资源裁剪打开。
        // Dedicated build type for obfuscation/shrinking verification: same as release but with R8 and resource shrinking enabled.
        // 用法 / Usage: ./gradlew assembleReleaseObfuscated
        releaseObfuscated {
            initWith release
            matchingFallbacks = ['release']
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        buildConfig true
    }
    viewBinding {
        enable = true
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    packagingOptions {
        // 确保只保留第一个遇到的so文件
        // Keep only the first occurrence of each shared library file.
        pickFirst 'lib/arm64-v8a/libr2aud.so'
        pickFirst 'lib/armeabi-v7a/libr2aud.so'
    }

}

dependencies {
    testImplementation libs.junit
    testImplementation "org.json:json:20240303"
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.appcompat
    implementation("com.rokid.security:glass3.open.sdk:2.2.2-E")
    implementation "com.google.code.gson:gson:2.8.6"
    implementation "com.squareup.okhttp3:okhttp:4.9.1"
}
