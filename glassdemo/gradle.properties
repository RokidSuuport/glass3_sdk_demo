# 构建配置 / Build settings
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.enableJetifier=true

# 在线语音配置；替换占位值，真实密钥仅保存在本地。
# Online speech settings; replace placeholders and keep real credentials local.
# 语音服务地址
# Speech service endpoint
online.demo.domain=api.rokid.com
# 访问密钥 AK；请通过安全的本地配置方式填写，切勿提交真实密钥
# Access key (AK); fill it in through local configuration only, never commit real credentials.
online.demo.ak=******
# 签名密钥 SK；请通过安全的本地配置方式填写，切勿提交真实密钥
# Signing key (SK); fill it in through local configuration only, never commit real credentials.
online.demo.sk=******
# 用户唯一标识；可根据业务需求自定义
# Unique user identifier; customize it as needed.
online.demo.uid=demo-user
# 设备唯一标识；可根据业务需求自定义
# Unique device identifier; customize it as needed.
online.demo.deviceId=demo-device
# ASR 实时语音识别 WebSocket 接口路径
# WebSocket endpoint for ASR real-time speech recognition.
online.demo.asrPath=/ar/audio/api/ws/asr/streaming
# TTS 语音合成 WebSocket 接口路径
# WebSocket endpoint for TTS speech synthesis.
online.demo.ttsPath=/ar/audio/api/ws/tts
