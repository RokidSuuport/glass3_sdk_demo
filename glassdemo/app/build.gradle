plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.jetbrains.kotlin.android)
}

def privateSpeechDomain = providers.gradleProperty("online.demo.domain").orElse("")
def privateSpeechAk = providers.gradleProperty("online.demo.ak").orElse("")
def privateSpeechSk = providers.gradleProperty("online.demo.sk").orElse("")
def privateSpeechUid = providers.gradleProperty("online.demo.uid").orElse("")
def privateSpeechDeviceId = providers.gradleProperty("online.demo.deviceId").orElse("")
def privateSpeechAsrPath = providers.gradleProperty("online.demo.asrPath")
        .orElse("/ar/audio/api/ws/asr/streaming")
def privateSpeechTtsPath = providers.gradleProperty("online.demo.ttsPath")
        .orElse("/ar/audio/api/ws/tts")
def privateSpeechTrustAllCerts = providers.gradleProperty("online.demo.trustAllCerts")
        .orElse("false")

android {
    namespace 'com.rokid.glesse'
    compileSdk 34

    defaultConfig {
        applicationId "com.rokid.glesse"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "PRIVATE_SPEECH_DOMAIN", "\"${privateSpeechDomain.get()}\""
        buildConfigField "String", "PRIVATE_SPEECH_AK", "\"${privateSpeechAk.get()}\""
        buildConfigField "String", "PRIVATE_SPEECH_SK", "\"${privateSpeechSk.get()}\""
        buildConfigField "String", "PRIVATE_SPEECH_UID", "\"${privateSpeechUid.get()}\""
        buildConfigField "String", "PRIVATE_SPEECH_DEVICE_ID", "\"${privateSpeechDeviceId.get()}\""
        buildConfigField "String", "PRIVATE_SPEECH_ASR_PATH", "\"${privateSpeechAsrPath.get()}\""
        buildConfigField "String", "PRIVATE_SPEECH_TTS_PATH", "\"${privateSpeechTtsPath.get()}\""
        buildConfigField "boolean", "PRIVATE_SPEECH_TRUST_ALL_CERTS", privateSpeechTrustAllCerts.get()

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        buildConfig true
    }
    viewBinding {
        enable = true
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    packagingOptions {
        // 确保只保留第一个遇到的so文件
        // Keep only the first occurrence of each shared library file.
        pickFirst 'lib/arm64-v8a/libr2aud.so'
        pickFirst 'lib/armeabi-v7a/libr2aud.so'
    }

}

dependencies {
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation 'androidx.test:runner:1.4.0'
    androidTestImplementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.appcompat
    implementation libs.androidx.activity
    implementation libs.viewfinderview
    implementation libs.material
    implementation('com.rokid.security.glass3.qrcode:scanner:1.0.6') {
        exclude group: 'com.rokid.security', module: 'glass3.open.sdk'
    }
    implementation("com.rokid.security:glass3.open.sdk:2.2.2-E-SNAPSHOT")
    implementation("com.rokid.security.sdk:online-speech:0.1.1") {
        exclude group: "com.rokid.security", module: "glass3.open.sdk"
    }
    implementation "com.google.mlkit:barcode-scanning:17.2.0"
    implementation "com.google.code.gson:gson:2.8.6"
    implementation "com.github.bumptech.glide:glide:4.11.0"
    implementation "com.github.bumptech.glide:compiler:4.11.0"
    implementation "pub.devrel:easypermissions:2.0.1"
    implementation "com.squareup.okhttp3:okhttp:4.9.1"

}
