stages:
  - publish

variables:
  GIT_DEPTH: "0"
  GITHUB_REPOSITORY: "git@github.com:RokidSuuport/glass3_sdk_demo.git"

sync_to_github:
  stage: publish
  image:
    name: alpine/git:2.47.2
    entrypoint: [""]
  resource_group: github-main-sync
  interruptible: false
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - test -n "$GITHUB_DEPLOY_KEY"
    - mkdir -p "$HOME/.ssh"
    - chmod 700 "$HOME/.ssh"
    - |
      if [ -f "$GITHUB_DEPLOY_KEY" ]; then
        cp "$GITHUB_DEPLOY_KEY" "$HOME/.ssh/id_ed25519"
      else
        printf '%s\n' "$GITHUB_DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
      fi
    - chmod 600 "$HOME/.ssh/id_ed25519"
    - ssh-keyscan -t ed25519 github.com > "$HOME/.ssh/known_hosts"
    - chmod 600 "$HOME/.ssh/known_hosts"
  script:
    - git fetch --no-tags "$GITHUB_REPOSITORY" "+refs/heads/main:refs/remotes/github/main"
    - GITHUB_HEAD="$(git rev-parse refs/remotes/github/main)"
    - GITHUB_TREE="$(git rev-parse "${GITHUB_HEAD}^{tree}")"
    - GITLAB_TREE="$(git rev-parse "${CI_COMMIT_SHA}^{tree}")"
    - |
      if [ "$GITHUB_TREE" = "$GITLAB_TREE" ]; then
        echo "GitHub main is already synchronized."
        exit 0
      fi
    - export GIT_AUTHOR_NAME="RokidSuuport"
    - export GIT_AUTHOR_EMAIL="RokidSuuport@users.noreply.github.com"
    - export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
    - export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
    - PUBLIC_COMMIT="$(printf '%s\n' '同步 Glass3 SDK Demo' | git -c commit.gpgsign=false commit-tree "$GITLAB_TREE" -p "$GITHUB_HEAD")"
    - git push "$GITHUB_REPOSITORY" "$PUBLIC_COMMIT:refs/heads/main"
  after_script:
    - rm -f "$HOME/.ssh/id_ed25519"

