plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
}

apply from: rootProject.file('customer-publishing.gradle')

android {
    namespace 'com.rokid.glass.mediastream.transport.webrtc'
    compileSdk 34

    defaultConfig {
        minSdk 29
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // MediaPublisher accepts capture-module frame listener contracts in its cross-module ABI.
    api project(':glass3-media-capture')
    implementation 'com.squareup.okhttp3:okhttp:4.9.1'
    implementation 'io.github.webrtc-sdk:android-prefixed:137.7151.03'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
