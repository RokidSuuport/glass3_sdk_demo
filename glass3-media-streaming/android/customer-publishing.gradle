// 本工程维护用的可选打包验证，独立源码接入不依赖此文件。
// `from components.release` 会把当前模块的 release AAR 及其依赖关系一起写入 POM，
// 客户源码接入路径通过 scripts/verify-source-consumer.sh 另行验证。
android {
    publishing {
        singleVariant('release')
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.rokid.glass'
                artifactId = project.name
                version = '1.0.0'
            }
        }
        repositories {
            maven {
                name = 'customer'
                url = rootProject.layout.buildDirectory.dir('customer-repository')
            }
        }
    }
}
